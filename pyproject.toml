[project]
name = "climate-control"
version = "0.1.0"
description = "Home Assistant custom integration for smart, family-friendly heating control."
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "home-assistant-frontend==20261028.6",
    "mypy==2.4.1",
    "pytest-homeassistant==2026.11.2",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:backoff.*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FLY",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Scenario helpers take a room's settings and pytest fixtures as arguments.
"tests/**" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.climate_control", "tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant.*"]
ignore_missing_imports = true
